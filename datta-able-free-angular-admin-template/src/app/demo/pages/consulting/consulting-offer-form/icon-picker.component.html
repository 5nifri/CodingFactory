<div class="icon-picker">
  <div class="d-flex align-items-center gap-2 mb-2">
    <div class="icon-preview-box">
      @if (value) {
        <i class="bi" [ngClass]="value"></i>
      } @else {
        <span class="text-muted small">Aucune</span>
      }
    </div>
    <input type="text" class="form-control form-control-sm"
           placeholder="Rechercher une icône (cloud, code, gear...)"
           [ngModel]="search()" (ngModelChange)="search.set($event)">
  </div>

  <div class="icon-grid">
    @for (icon of filteredIcons(); track icon) {
      <button type="button"
              class="icon-option"
              [class.selected]="isSelected(icon)"
              [title]="icon"
              (click)="select(icon)">
        <i class="bi" [ngClass]="'bi-' + icon"></i>
      </button>
    } @empty {
      <p class="text-muted small mb-0">Aucune icône trouvée pour « {{ search() }} ».</p>
    }
  </div>

  <div class="mt-2">
    <label class="form-label small text-muted">Ou entrez une classe personnalisée (ex: bi-cloud-check)</label>
    <input type="text" class="form-control form-control-sm"
           [ngModel]="value" (ngModelChange)="onCustomInput($event)"
           placeholder="bi-nom-icone">
  </div>
</div>

<style>
  .icon-preview-box {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
    flex-shrink: 0;
    font-size: 1.25rem;
  }

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
    padding: 8px;
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
  }

  .icon-option {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    border: 1px solid transparent;
    border-radius: 0.375rem;
    background: transparent;
    font-size: 1.1rem;
    color: #495057;
    cursor: pointer;
  }

  .icon-option:hover {
    background: #f1f3f5;
  }

  .icon-option.selected {
    border-color: #0d6efd;
    background: #e7f1ff;
    color: #0d6efd;
  }
</style>
