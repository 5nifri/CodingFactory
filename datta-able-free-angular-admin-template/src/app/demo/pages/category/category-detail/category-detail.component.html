<div class="row">
  <div class="col-xl-8">
    <app-card [cardTitle]="(category()?.name ?? 'Catégorie')" [options]="false">

      @if (loading()) {
        <p class="text-center">Chargement...</p>
      } @else if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
        <button class="btn btn-outline-secondary" (click)="goBack()">
          <i class="feather icon-arrow-left"></i> Retour
        </button>
      } @else if (category()) {
        <div class="mb-3">
          <button class="btn btn-outline-secondary btn-sm mb-3" (click)="goBack()">
            <i class="feather icon-arrow-left"></i> Retour aux catégories
          </button>
        </div>

        <div class="form-group mb-4">
          <label class="text-muted small text-uppercase">Description</label>
          <div class="p-3 bg-light rounded border">
            <p class="mb-0" style="white-space: pre-wrap;">
              {{ category()!.description ?? 'Aucune description.' }}
            </p>
          </div>
        </div>

        <div class="d-flex gap-2">
          <a [routerLink]="['/categories', categoryId, 'edit']" class="btn btn-primary">
            <i class="feather icon-edit"></i> Modifier
          </a>
          <button class="btn btn-outline-secondary" (click)="goBack()">Retour</button>
        </div>
      }

    </app-card>
  </div>

  @if (category()) {
    <div class="col-xl-4">
      <app-card cardTitle="Informations" [options]="false">
        <ul class="list-unstyled mb-0">
          <li class="mb-2">
            <small class="text-muted d-block">ID</small>
            <span class="fw-bold">#{{ category()!.id }}</span>
          </li>
          <li>
            <small class="text-muted d-block">Nom</small>
            <span class="fw-bold">{{ category()!.name }}</span>
          </li>
        </ul>
      </app-card>
    </div>
  }
</div>
