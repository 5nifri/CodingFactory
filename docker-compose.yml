services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codingfactory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/codingfactory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: MySuperSecretKeyForCodingFactoryProject2026MustBeLongEnough123!
      JWT_EXPIRATION: "86400000"
      PEXELS_API_KEY: pYhztCeue3vhW9F9xDNq9kEtRTEXWQVcErjRu1Osaaw1zPzT988kqnK8
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "4200:80"

  admin:
    build: ./datta-able-free-angular-admin-template
    ports:
      - "4201:80"

volumes:
  pgdata: