<div class="page-container">

  <h1 class="page-title">Our Formations</h1>

  <div *ngIf="loading()" class="center-box">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="error()" class="center-box">
    <p>Could not load formations. Please try again later.</p>
  </div>

  <div *ngIf="!loading() && !error() && formations().length === 0" class="center-box">
    <p>No formations available yet.</p>
  </div>

  <div class="formation-grid" *ngIf="!loading() && !error()">
    <mat-card
      class="formation-card"
      *ngFor="let formation of formations()"
      (click)="viewDetail(formation.id)">

      <img
        mat-card-image
        [src]="formation.imageUrl || 'https://placehold.co/400x200?text=Formation'"
        alt="{{ formation.title }}">

      <mat-card-header>
        <mat-card-title>{{ formation.title }}</mat-card-title>
        <mat-card-subtitle>{{ formation.categoryName }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p class="description">{{ formation.description }}</p>

        <mat-chip-set class="meta-row">
          <mat-chip>{{ formation.duration }}</mat-chip>
          <mat-chip>{{ formation.totalCourses }} courses</mat-chip>
        </mat-chip-set>

        <p class="price">{{ formation.price }} TND</p>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button color="primary">View Details</button>
      </mat-card-actions>

    </mat-card>
  </div>

</div>
