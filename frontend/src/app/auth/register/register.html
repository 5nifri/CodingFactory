<div class="auth-container">
	<mat-card class="auth-card">
		<mat-card-header>
			<mat-card-title>Create an account</mat-card-title>
		</mat-card-header>

		<mat-card-content>
			<form (ngSubmit)="onSubmit()" #registerForm="ngForm">

				<mat-form-field appearance="outline" class="full-width">
					<mat-label>First name</mat-label>
					<input matInput name="firstName" [(ngModel)]="firstName" required>
				</mat-form-field>

				<mat-form-field appearance="outline" class="full-width">
					<mat-label>Last name</mat-label>
					<input matInput name="lastName" [(ngModel)]="lastName" required>
				</mat-form-field>

				<mat-form-field appearance="outline" class="full-width">
					<mat-label>Email</mat-label>
					<input matInput type="email" name="email" [(ngModel)]="email" required>
				</mat-form-field>

				<mat-form-field appearance="outline" class="full-width">
					<mat-label>Password</mat-label>
					<input matInput type="password" name="password" [(ngModel)]="password" required minlength="6">
				</mat-form-field>

				<button mat-raised-button color="primary" type="submit"
								class="full-width" [disabled]="loading">
					{{ loading ? 'Creating account...' : 'Register' }}
				</button>

			</form>

			<p class="switch-link">
				Already have an account? <a routerLink="/login">Login</a>
			</p>
		</mat-card-content>
	</mat-card>
</div>
