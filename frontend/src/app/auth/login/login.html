<div class="page-title dark-background" data-aos="fade" style="background-image: url(assets/img/page-title-bg.webp);">
  <div class="container position-relative">
    <h1>Connexion</h1>
    <p>Accédez à votre espace CodingFactory</p>
    <nav class="breadcrumbs">
      <ol>
        <li><a routerLink="/">Home</a></li>
        <li class="current">Connexion</li>
      </ol>
    </nav>
  </div>
</div>

<section class="contact section">
  <div class="container" data-aos="fade-up">
    <div class="row justify-content-center">
      <div class="col-lg-6">

        <div class="section-title">
          <h2>Se connecter</h2>
          <p>Entrez vos identifiants</p>
        </div>

        @if (error) {
          <div class="alert alert-danger">{{ error }}</div>
        }

        <form (ngSubmit)="onSubmit()" class="php-email-form">
          <div class="mb-3">
            <input class="form-control" type="email" name="email"
                   [(ngModel)]="email" placeholder="Email" required>
          </div>

          <div class="mb-3">
            <input class="form-control" type="password" name="password"
                   [(ngModel)]="password" placeholder="Mot de passe" required>
          </div>

          <!-- 👇 Link moved here (before submit button) -->
          <div class="text-center mt-3">
            <p class="mb-0">
              Vous n'avez pas de compte ?
              <a routerLink="/register">Créer un compte</a>
            </p>
          </div>

          <div class="text-center mt-3">
            <button type="submit" [disabled]="loading">
              {{ loading ? 'Connexion...' : 'Se connecter' }}
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</section>
