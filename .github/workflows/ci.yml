name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build backend with Maven
        run: ./mvnw clean package -DskipTests -B

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: datta-able-free-angular-admin-template
        run: npm install
      - name: Build admin template
        working-directory: datta-able-free-angular-admin-template
        run: npm run build

  ml-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt
      - name: Verify service imports correctly
        working-directory: ml-service
        run: |
          python -c "from src.main import app; print('ml-service OK')"

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, admin, ml-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t codingfactory-backend .
      - name: Build frontend image
        run: docker build -t codingfactory-frontend ./frontend
      - name: Build admin image
        run: docker build -t codingfactory-admin ./datta-able-free-angular-admin-template
      - name: Build ml-service image
        run: docker build -t codingfactory-ml ./ml-service